name: Build, Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/ucosa-na
  CONTAINER_NAME: ucosa-na-app

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          no-cache: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Deploy to DigitalOcean
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e

            # Ensure the app-network exists
            docker network inspect app-network >/dev/null 2>&1 || docker network create app-network

            # Start PostgreSQL if not already running
            if ! docker ps --format '{{.Names}}' | grep -q '^ucosa-postgres$'; then
              echo "Starting PostgreSQL container..."
              docker run -d \
                --name ucosa-postgres \
                --restart unless-stopped \
                --network app-network \
                --env-file /opt/ucosa-na/.env \
                -v ucosa-postgres-data:/var/lib/postgresql/data \
                postgres:16-alpine
              echo "Waiting for PostgreSQL to be ready..."
              sleep 10
            fi

            # Inject secrets into .env on the server
            mkdir -p /opt/ucosa-na
            touch /opt/ucosa-na/.env
            # Update or add each secret
            grep -q "^SENDGRID_API_KEY=" /opt/ucosa-na/.env \
              && sed -i "s|^SENDGRID_API_KEY=.*|SENDGRID_API_KEY=${{ secrets.SENDGRID_API_KEY }}|" /opt/ucosa-na/.env \
              || echo "SENDGRID_API_KEY=${{ secrets.SENDGRID_API_KEY }}" >> /opt/ucosa-na/.env
            grep -q "^EMAIL_USER=" /opt/ucosa-na/.env \
              && sed -i "s|^EMAIL_USER=.*|EMAIL_USER=${{ secrets.EMAIL_USER }}|" /opt/ucosa-na/.env \
              || echo "EMAIL_USER=${{ secrets.EMAIL_USER }}" >> /opt/ucosa-na/.env
            grep -q "^TWILIO_ACCOUNT_SID=" /opt/ucosa-na/.env \
              && sed -i "s|^TWILIO_ACCOUNT_SID=.*|TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}|" /opt/ucosa-na/.env \
              || echo "TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}" >> /opt/ucosa-na/.env
            grep -q "^TWILIO_AUTH_TOKEN=" /opt/ucosa-na/.env \
              && sed -i "s|^TWILIO_AUTH_TOKEN=.*|TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }}|" /opt/ucosa-na/.env \
              || echo "TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }}" >> /opt/ucosa-na/.env
            grep -q "^TWILIO_PHONE_NUMBER=" /opt/ucosa-na/.env \
              && sed -i "s|^TWILIO_PHONE_NUMBER=.*|TWILIO_PHONE_NUMBER=${{ secrets.TWILIO_PHONE_NUMBER }}|" /opt/ucosa-na/.env \
              || echo "TWILIO_PHONE_NUMBER=${{ secrets.TWILIO_PHONE_NUMBER }}" >> /opt/ucosa-na/.env
            grep -q "^TWILIO_ALPHA_SENDER=" /opt/ucosa-na/.env \
              && sed -i "s|^TWILIO_ALPHA_SENDER=.*|TWILIO_ALPHA_SENDER=${{ secrets.TWILIO_ALPHA_SENDER }}|" /opt/ucosa-na/.env \
              || echo "TWILIO_ALPHA_SENDER=${{ secrets.TWILIO_ALPHA_SENDER }}" >> /opt/ucosa-na/.env
            grep -q "^VONAGE_API_KEY=" /opt/ucosa-na/.env \
              && sed -i "s|^VONAGE_API_KEY=.*|VONAGE_API_KEY=${{ secrets.VONAGE_API_KEY }}|" /opt/ucosa-na/.env \
              || echo "VONAGE_API_KEY=${{ secrets.VONAGE_API_KEY }}" >> /opt/ucosa-na/.env
            grep -q "^VONAGE_API_SECRET=" /opt/ucosa-na/.env \
              && sed -i "s|^VONAGE_API_SECRET=.*|VONAGE_API_SECRET=${{ secrets.VONAGE_API_SECRET }}|" /opt/ucosa-na/.env \
              || echo "VONAGE_API_SECRET=${{ secrets.VONAGE_API_SECRET }}" >> /opt/ucosa-na/.env
            grep -q "^VONAGE_PHONE_NUMBER=" /opt/ucosa-na/.env \
              && sed -i "s|^VONAGE_PHONE_NUMBER=.*|VONAGE_PHONE_NUMBER=${{ secrets.VONAGE_PHONE_NUMBER }}|" /opt/ucosa-na/.env \
              || echo "VONAGE_PHONE_NUMBER=${{ secrets.VONAGE_PHONE_NUMBER }}" >> /opt/ucosa-na/.env

            # Deploy app — pull with retry
            cd /opt/ucosa-na
            for i in 1 2 3; do
              docker pull ${{ env.IMAGE_NAME }}:latest && break
              echo "Pull attempt $i failed, retrying in 10s..."
              sleep 10
            done
            docker stop ${{ env.CONTAINER_NAME }} || true
            docker rm ${{ env.CONTAINER_NAME }} || true
            # Ensure all media directories exist on host (populate once via SCP/rsync)
            mkdir -p \
              /opt/ucosa-na/media/Video2 \
              /opt/ucosa-na/media/Golden_Jubilee \
              "/opt/ucosa-na/media/Gala-night" \
              /opt/ucosa-na/media/Principal_Building_Commissioning \
              /opt/ucosa-na/media/computer_lab \
              /opt/ucosa-na/media/Welcome-night \
              "/opt/ucosa-na/media/pic1" \
              "/opt/ucosa-na/media/current executive" \
              "/opt/ucosa-na/media/Past executives" \
              /opt/ucosa-na/media/911-Museum \
              /opt/ucosa-na/media/Minute_Of_Meetings \
              /opt/ucosa-na/media/ucosa_na_members \
              /opt/ucosa-na/media/ucosa-na-members \
              /opt/ucosa-na/media/photo_gallery
            docker run -d \
              --name ${{ env.CONTAINER_NAME }} \
              --restart unless-stopped \
              --network app-network \
              -p 3000:3000 \
              --env-file /opt/ucosa-na/.env \
              -v "/opt/ucosa-na/media/Video2:/app/public/Video2:ro" \
              -v "/opt/ucosa-na/media/Golden_Jubilee:/app/public/Golden_Jubilee:ro" \
              -v "/opt/ucosa-na/media/Gala-night:/app/public/Gala-night:ro" \
              -v "/opt/ucosa-na/media/Principal_Building_Commissioning:/app/public/Principal_Building_Commissioning:ro" \
              -v "/opt/ucosa-na/media/computer_lab:/app/public/computer_lab:ro" \
              -v "/opt/ucosa-na/media/Welcome-night:/app/public/Welcome-night:ro" \
              -v "/opt/ucosa-na/media/pic1:/app/public/pic1:ro" \
              -v "/opt/ucosa-na/media/current executive:/app/public/current executive:ro" \
              -v "/opt/ucosa-na/media/Past executives:/app/public/Past executives:ro" \
              -v "/opt/ucosa-na/media/911-Museum:/app/public/911-Museum:ro" \
              -v "/opt/ucosa-na/media/Minute_Of_Meetings:/app/public/Minute_Of_Meetings:ro" \
              -v "/opt/ucosa-na/media/ucosa_na_members:/app/public/ucosa_na_members:ro" \
              -v "/opt/ucosa-na/media/ucosa-na-members:/app/public/ucosa-na-members:ro" \
              -v "/opt/ucosa-na/media/photo_gallery:/app/public/photo_gallery:ro" \
              ${{ env.IMAGE_NAME }}:latest
            docker image prune -f

            # Wait for container to become healthy
            echo "Waiting for app to start..."
            for i in $(seq 1 12); do
              sleep 5
              STATUS=$(docker inspect --format='{{.State.Status}}' ${{ env.CONTAINER_NAME }} 2>/dev/null || echo 'missing')
              if [ "$STATUS" = "running" ]; then
                if curl -sf http://localhost:3000/health >/dev/null 2>&1; then
                  echo "App is healthy after $((i*5))s"
                  break
                fi
              elif [ "$STATUS" = "exited" ] || [ "$STATUS" = "dead" ]; then
                echo "Container failed to start:"
                docker logs --tail 30 ${{ env.CONTAINER_NAME }}
                exit 1
              fi
              echo "  waiting... ($((i*5))s)"
            done
            echo "Deployed ${{ github.sha }} at $(date)"
