<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — UCOSA-NA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f6f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #1a1a2e;
      color: white;
      text-align: center;
      padding: 24px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    header img { width: 52px; height: 52px; object-fit: contain; border-radius: 8px; }
    header h1 { font-size: 1.3rem; }
    header p  { font-size: 0.8rem; color: #aab4c8; }
    .back-bar { background: #16213e; padding: 10px 24px; }
    .back-bar a { color: #cdd6f4; text-decoration: none; font-size: 0.85rem; }
    .back-bar a:hover { color: white; }
    .wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }
    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 44px 40px;
      width: 100%;
      max-width: 420px;
    }
    .card h2 { font-size: 1.5rem; color: #1a1a2e; margin-bottom: 6px; text-align: center; }
    .card .subtitle { text-align: center; color: #888; font-size: 0.9rem; margin-bottom: 28px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 0.875rem; font-weight: 600; color: #444; margin-bottom: 6px; }
    input[type="password"] {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #dde3f0;
      border-radius: 8px;
      font-size: 0.95rem;
      color: #333;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="password"]:focus { border-color: #1a1a2e; }
    .hint { font-size: 0.78rem; color: #999; margin-top: 5px; }
    .btn-submit {
      width: 100%;
      padding: 12px;
      background: #1a1a2e;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }
    .btn-submit:hover { background: #16213e; }
    .btn-submit:disabled { background: #888; cursor: not-allowed; }
    #statusMsg {
      display: none;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 0.875rem;
      margin-bottom: 16px;
    }
    footer {
      background: #1a1a2e;
      color: #aab4c8;
      text-align: center;
      padding: 18px 20px;
      font-size: 0.8rem;
    }
    @media (max-width: 480px) { .card { padding: 32px 22px; } }
  </style>
</head>
<body>

  <header>
    <img src="/logo.jpg" alt="UCOSA-NA Logo" />
    <div>
      <h1>UCOSA-North America</h1>
      <p>Member Portal</p>
    </div>
  </header>

  <div class="back-bar">
    <a href="/login.html">&larr; Back to Login</a>
  </div>

  <div class="wrapper">
    <div class="card">
      <h2>&#128273; Reset Password</h2>
      <p class="subtitle">Enter your new password below</p>

      <div id="statusMsg"></div>

      <form id="resetForm">
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input type="password" id="newPassword" placeholder="New password" required />
          <p class="hint">At least 8 characters, one uppercase letter, one special character.</p>
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" placeholder="Repeat new password" required />
        </div>
        <button type="submit" class="btn-submit" id="submitBtn">Set New Password</button>
      </form>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 UCOSA-North America. All rights reserved.</p>
  </footer>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token  = params.get('token');

    if (!token) {
      showStatus('Invalid or missing reset link. Please request a new one from the login page.', false);
      document.getElementById('resetForm').style.display = 'none';
    }

    document.getElementById('resetForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const newPassword     = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const submitBtn       = document.getElementById('submitBtn');

      if (newPassword !== confirmPassword) {
        showStatus('Passwords do not match.', false);
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Saving…';

      try {
        const res  = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword }),
        });
        const data = await res.json();

        if (!res.ok) {
          showStatus(data.error || 'Could not reset password. Please try again.', false);
          return;
        }

        showStatus('Your password has been reset successfully. Redirecting to login…', true);
        document.getElementById('resetForm').style.display = 'none';
        setTimeout(() => { window.location.href = '/login.html'; }, 2500);
      } catch (err) {
        showStatus('Network error. Please check your connection and try again.', false);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Set New Password';
      }
    });

    function showStatus(text, success) {
      const el = document.getElementById('statusMsg');
      el.textContent = text;
      el.style.background = success ? '#e8f5e9' : '#fff0f0';
      el.style.color       = success ? '#2e7d32' : '#c1121f';
      el.style.border      = `1px solid ${success ? '#a5d6a7' : '#e63946'}`;
      el.style.display     = 'block';
    }
  </script>
</body>
</html>
